# Component Definition: Comprehensive Income
# Net Income plus Other Comprehensive Income items

component_id: comprehensive_income
display_name: "Comprehensive Income"
description: "Total change in equity from non-owner sources. Net Income plus OCI items."

category: income_statement
subcategory: profitability

characteristics:
  balance_type: credit
  period_type: duration
  is_monetary: true
  is_abstract: false
  data_type: monetary

matching_rules:
  label_rules:
    - patterns:
        - "Comprehensive Income (Loss)"
        - "Comprehensive Income"
        - "Total Comprehensive Income"
        - "Comprehensive Income (Loss), Net of Tax"
      match_type: exact
      case_sensitive: false
      weight: 20

    - patterns:
        - "comprehensive income"
        - "total comprehensive"
      match_type: contains
      case_sensitive: false
      weight: 12

  local_name_rules:
    - patterns:
        - "ComprehensiveIncomeNetOfTax"
        - "ComprehensiveIncome"
      match_type: exact
      weight: 15

    - patterns:
        - "ComprehensiveIncome"
        - "TotalComprehensiveIncome"
      match_type: contains
      weight: 10

  hierarchy_rules:
    - rule_type: depth_level
      pattern: "1-2"
      weight: 5

  definition_rules:
    - keywords:
        - "comprehensive"
        - "total change in equity"
        - "non-owner"
      all_required: false
      weight: 4

scoring:
  min_score: 18
  confidence_levels:
    high: 32
    medium: 25
    low: 18
  tiebreaker: highest_in_hierarchy
  reject_if:
    - condition: "Is abstract concept"
      pattern: "abstract=true"
    - condition: "Is OCI component only"
      pattern: "name~othercomprehensive"
    - condition: "Is per share item"
      pattern: "name~pershare"
    - condition: "Is noncontrolling"
      pattern: "name~noncontrolling"
    - condition: "Is text block"
      pattern: "name~textblock"
    - condition: "Is schedule"
      pattern: "name~schedule"
    - condition: "Is reclassification"
      pattern: "name~reclassification"

composition:
  is_composite: false

validation:
  expected_sign: either
